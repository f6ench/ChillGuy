[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "betfair-trader"
version = "0.1.0"
description = "AI-powered Betfair Exchange trading bot with Claude intelligence layer"
requires-python = ">=3.10"
dependencies = [
    "betfairlightweight>=2.20.1",
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.39.0",
]

[project.optional-dependencies]
scraping = ["beautifulsoup4>=4.12.0", "playwright>=1.40.0", "tweepy>=4.14.0"]
audio = ["openai-whisper>=20231117"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.1.0"]

[project.scripts]
betfair-trader = "betfair_trader.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
